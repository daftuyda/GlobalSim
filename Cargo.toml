[package]
name = "race_engine_rs"
version = "0.1.0"
edition = "2021"

# Bin crate that speaks the same JSON-on-stdin/stdout contract the existing
# Node subprocess (race_simulator._run_simulation_node) uses -- a drop-in
# swap for the hot path only, not a rewrite of the server.
[lib]
name = "globalsim"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "race_engine_rs_v2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["fast-alloc"]
# mimalloc as the global allocator: lower latency (needs a C compiler). Build
# with --no-default-features to use the platform allocator instead.
fast-alloc = ["dep:mimalloc"]
# Leave the captured course geometry assets (data/course_geometry, most of the
# binary's size) out of the build; hosts register a course's geometry at
# runtime with `register_course_geometry` before preparing a race on it.
external-geometry = []
# Opt-in third-party comparison profile. See docs/EXPERIMENTAL.md.
experimental-umamoe = ["experimental-gap-refresh", "experimental-duel-hp"]
# Components can be evaluated independently against official captures.
experimental-gap-refresh = []
experimental-duel-hp = []

[dependencies]
mimalloc = { version = "0.1.52", optional = true, default-features = false }
