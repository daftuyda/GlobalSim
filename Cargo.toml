[package]
name = "race_engine_rs"
version = "0.1.0"
edition = "2021"

# Bin crate that speaks the same JSON-on-stdin/stdout contract the existing
# Node subprocess (race_simulator._run_simulation_node) uses -- a drop-in
# swap for the hot path only, not a rewrite of the server.
[lib]
name = "globalsim"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "race_engine_rs_v2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
# Use the platform allocator unless explicitly building for lower latency.
fast-alloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "0.1.52", optional = true, default-features = false }
